<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ElecSim</title>
<link rel="stylesheet" href="css/style.css?v=100">
</head>
<body>
<div id="err"></div>
<div id="toast"></div>
<canvas id="c"></canvas>

<!-- شريط الحالة العلوي -->
<div id="status">
  <div class="pill" id="pillMode">✈️ طيران</div>
  <div class="pill" id="pillTool">🖱️ تحديد</div>
  <div class="pill warn" id="pillWarn" style="display:none"></div>
</div>

<!-- شريط الأدوات الجانبي -->
<div id="side">
  <button class="iconbtn" id="btnUndo" title="تراجع">↶</button>
  <button class="iconbtn" id="btnRedo" title="إعادة">↷</button>
  <button class="iconbtn" id="btnLang" title="اللغة">AR</button>
</div>

<!-- التنبيه المؤقت -->
<div id="hint">اختر تبويبًا من الأسفل لبدء العمل</div>

<!-- الرصيف السفلي (4 تبويبات) -->
<div id="dock">
  <button class="dockbtn active" data-tab="tools">
    <span class="ico">🛠️</span><span>أدوات</span>
  </button>
  <button class="dockbtn" data-tab="electric">
    <span class="ico">⚡</span><span>كهرباء</span>
  </button>
  <button class="dockbtn" data-tab="board">
    <span class="ico">📋</span><span>لوحة</span>
  </button>
  <button class="dockbtn" data-tab="project">
    <span class="ico">💾</span><span>مشروع</span>
  </button>
</div>

<!-- لوحة منبثقة من الأسفل -->
<div id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="sheetTitle">الأدوات</div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- نافذة عامة -->
<div id="modal">
  <div class="modal-card">
    <h3 id="modalTitle">—</h3>
    <div id="modalBody"></div>
    <button id="modalClose">إغلاق</button>
  </div>
</div>

<script src="lib/three.min.js?v=100"></script>
<script src="js/i18n.js?v=100"></script>
<script src="js/materials.js?v=100"></script>
<script src="js/world.js?v=100"></script>
<script src="js/components.js?v=100"></script>
<script src="js/circuits.js?v=100"></script>
<script src="js/storage.js?v=100"></script>
<script src="js/history.js?v=100"></script>
<script src="js/controls.js?v=100"></script>
<script src="js/builder.js?v=100"></script>
<script src="js/ui.js?v=100"></script>
<script src="js/main.js?v=100"></script>
</body>
</html>
